name: Daily update

on:
  schedule:
    - cron: "17 1 * * *"   # 09:17 Beijing time, daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Crawl, verify, generate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/crawl.py
          python scripts/verify.py
          python scripts/generate.py

      - name: Commit changes
        run: |
          git config user.name "dsh-skills-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "chore: daily data refresh $(date -u +%F)"
          git push
