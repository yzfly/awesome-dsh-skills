name: Lint tests
on:
  push:
    paths: ["dsh_skill_lint/**", "tests/**", "pyproject.toml"]
  pull_request:
    paths: ["dsh_skill_lint/**", "tests/**", "pyproject.toml"]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m dsh_skill_lint tests/fixtures/good --strict
